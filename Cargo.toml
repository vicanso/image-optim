[package]
name = "image-optim"
version = "0.6.0"
edition = "2024"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
build = "build.rs"

[lints.clippy]
# Set the unwrap_used lint level to deny
unwrap_used = "deny"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
axum-extra = { version = "0.12.6", features = ["cookie", "cookie-signed"] }
base64 = "0.23.1"
bytes = "1.12.1"
cached = { version = "4.0.1", features = ["async", "proc_macro"] }
ctor = "1.0.13"
imageoptimize = "0.7.0"
num_cpus = "1.17.0"
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
once_cell = "1.21.4"
regex = "1.13.1"
rust-embed = "8.12.0"
serde = "1.0.229"
tibba-config = "0.3.0"
tibba-error = "0.3.0"
tibba-middleware = "0.3.0"
tibba-opendal = "0.3.0"
tibba-router-common = "0.3.0"
tibba-runtime = { version = "0.3.0", features = ["process-info", "scheduler"] }
tibba-util = "0.3.0"
time = "0.3.55"
tokio = { version = "1.53.2", features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "net",
    "signal",
    "fs",
] }
tower = { version = "0.5.3", features = ["timeout"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["local-time"] }
validator = "0.21.0"

[build-dependencies]
vergen = { version = "9.1.0", features = ["build"] }
vergen-git2 = "9.1.0"

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"
