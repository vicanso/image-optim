[package]
name = "image-optim"
version = "0.5.2"
edition = "2024"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
build = "build.rs"

[lints.clippy]
# Set the unwrap_used lint level to deny
unwrap_used = "deny"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
axum-extra = { version = "0.12.6", features = ["cookie", "cookie-signed"] }
base64 = "0.22.1"
bytes = "1.11.1"
cached = { version = "1.1.0", features = ["async", "proc_macro"] }
ctor = "1.0.7"
imageoptimize = "0.5.3"
num_cpus = "1.17.0"
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
once_cell = "1.21.4"
regex = "1.12.3"
rust-embed = "8.11.0"
serde = "1.0.228"
tibba-config = "0.2.2"
tibba-error = "0.2.2"
tibba-hook = "0.2.2"
tibba-middleware = "0.2.2"
tibba-opendal = "0.2.3"
tibba-performance = "0.2.2"
tibba-router-common = "0.2.2"
tibba-scheduler = "0.2.2"
tibba-state = "0.2.2"
tibba-util = "0.2.2"
time = "0.3.47"
tokio = { version = "1.52.3", features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "net",
    "signal",
    "fs",
] }
tower = { version = "0.5.3", features = ["timeout"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["local-time"] }
validator = "0.20.0"

[build-dependencies]
vergen = { version = "9.1.0", features = ["build"] }
vergen-git2 = "9.1.0"

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"
